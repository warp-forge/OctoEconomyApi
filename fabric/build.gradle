plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT' // Актуальная версия для 1.20.1
    id 'com.github.johnrengelman.shadow' version '8.1.1' // Версия, совместимая с Gradle 8+
}

// В Gradle 8 archivesBaseName задается через блок base
base {
    archivesName = project.archives_base_name
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

repositories {
    mavenCentral()
}

configurations {
    shade
    compileClasspath.extendsFrom shade
    runtimeClasspath.extendsFrom shade
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Используем Yarn (стандарт для Fabric) или Official
    // Переменная yarn_mappings должна быть в gradle.properties
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Теневая зависимость от общего кода (rootProject)
    // Common код собираем, но не включаем транзитивные зависимости, чтобы не дублировать
    shade(project(path: ":")) {
        transitive = false
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Настройка задач для генерации данных (Datagen)
loom {
    runs {
        datagen {
            server()
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${project.archives_base_name}"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            runDir "build/datagen"
        }
    }
}

// Настройка Java 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Настройка ShadowJar (сборка "толстого" джарника с общим кодом)
shadowJar {
    // Указываем, какие конфигурации вшивать
    configurations = [project.configurations.shade]

    // В Gradle 8 используется archiveClassifier вместо classifier
    archiveClassifier.set("dev-shadow")

    // Исключаем лишнее, если нужно
    exclude('META-INF/*.SF')
    exclude('META-INF/*.DSA')
    exclude('META-INF/*.RSA')
}

// Настройка RemapJar (превращает dev-jar в готовый мод)
remapJar {
    // Говорим Loom, что входной файл — это результат работы shadowJar
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar

    // Финальное имя файла (без классификатора)
    archiveClassifier.set(null)
}

jar {
    // Обычный jar нам не нужен, так как мы используем shadowJar -> remapJar
    archiveClassifier.set("dev")
}

// Настройка публикации
publishing {
    publications {
        mavenJava(MavenPublication) {
            // Публикуем результат задачи remapJar (готовый мод)
            artifact(remapJar) {
                builtBy remapJar
            }
            // И исходники
            artifact(sourcesJar) {
                builtBy remapSourcesJar
            }

            artifactId = "${project.archives_base_name}-fabric"
        }
    }
}